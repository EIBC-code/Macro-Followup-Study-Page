<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.3/css/all.css">

<style>
  :root {
    color-scheme: light;
    /* 팔레트: 초록 #104429 · 노랑 #FFD966 · 진한회색 #595959 · 중간회색 #A5A5A5 · 연한회색 #D9D9D9 · 배경 미색 #F8F8F6 (+ 흰색·검은색) */
    --bg: #F8F8F6;        /* 눈이 편한 미색 (중립 톤) */
    --card: #F8F8F6;      /* 카드도 배경과 같게 (테두리 없는 디자인이라) */
    --line: #D9D9D9;      /* 카드 테두리·표 구분선 */
    --track: #D9D9D9;     /* 막대 빈 칸·마우스 올렸을 때 배경 */
    --title-bg: #ECECE9;  /* 카드 제목 박스 (배경 #F8F8F6보다 한 단계 진하게) */
    --rule: #404040;      /* 섹션 제목 아래 선 */
    --text-1: #000000;    /* 본문·숫자 */
    --text-2: #595959;    /* 보조 글자 */
    --text-3: #A5A5A5;    /* 날짜·표 머리글 같은 흐린 글자 */
    --brand: #104429;     /* 제목·강조 (초록) */
    --up: #d6453d;        /* 상승 막대 (한국식: 빨강) */
    --down: #2f6fd6;      /* 하락 막대 (한국식: 파랑) */
    --up-text: #b8302a;
    --down-text: #1f58b5;
    --neutral: #A5A5A5;   /* 공포탐욕 게이지 현재 구간 */
    --accent: #104429;    /* 게이지 바늘·FedWatch 유력 막대 */
    --warn-bg: #FFD966;   /* '이전 값' 배지·안내 띠 */
    --warn-text: #000000;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text-1);
    font-family: 'KoPubWorld Dotum', system-ui, -apple-system, sans-serif;
    font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 16px 48px; }

  /* 머리: [로고 + 학회명 ············ Update Button] / 선 / Macro Terminal */
  .topbar { background: var(--brand); box-shadow: 0 3px 8px rgba(0, 0, 0, .18); }   /* 초록 띠 + 아래 그림자 */
  .topbar-in { max-width: 1180px; margin: 0 auto; padding: 16px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: flex-end; gap: 14px; }
  .brand img { display: block; height: 48px; }
  .brand-sub { font-family: 'KoPubWorld Batang', serif; font-size: 14px; line-height: 1; color: #FFFFFF; white-space: nowrap; }
  .title { margin: 8px 0 32px; }
  .topbar .status { color: var(--title-bg); }
  h1 { font-family: 'KoPubWorld Batang', serif; color: var(--text-1); font-size: 50px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  .sub { color: var(--text-2); font-size: 13px; margin-top: 2px; }
  .actions { display: flex; align-items: center; gap: 10px; }
  .status { color: var(--text-3); font-size: 12px; }
  button {
    font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
    padding: 8px 14px; border-radius: 0; border: 0;
    background: #FFFFFF; color: var(--text-1);
  }
  button:hover { opacity: .85; }
  button:disabled { opacity: .55; cursor: default; }

  .notice { background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }

  h2 { font-size: 26px; font-weight: 700; color: var(--text-1); text-align: left; margin: 44px 0 20px; padding-bottom: 6px; border-bottom: 2px solid var(--rule); }
  h2:first-of-type { margin-top: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px 32px; }
  .card { background: var(--card); min-width: 0; display: flex; flex-direction: column; padding: 0 8px; }
  .card.wide { grid-column: span 2; }
  @media (max-width: 680px) { .card.wide { grid-column: auto; } }
  .card-title { background: var(--title-bg); text-align: center; font-size: 14px; font-weight: 700; padding: 6px 10px; margin: 0 -8px 12px; }
  .meta { margin-top: auto; padding-top: 10px; text-align: right; color: var(--text-3); font-size: 12px; white-space: nowrap; }
  .badge { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-text); margin-left: 6px; vertical-align: 1px; cursor: help; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: right; font-weight: 500; color: var(--text-3); font-size: 12px; padding: 0 0 6px; }
  th:first-child, td:first-child { text-align: left; }
  td { text-align: right; padding: 6px 0; border-top: 1px solid var(--line); white-space: nowrap; }
  td:first-child { color: var(--text-2); }

  .up { color: var(--up-text); }
  .down { color: var(--down-text); }
  .flat { color: var(--text-3); }

  .hero { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .hero .big { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .hero .unit { font-size: 15px; color: var(--text-2); font-weight: 500; }
  .chip { display: inline-block; font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--text-2); }
  .note { color: var(--text-2); font-size: 13px; margin-top: 10px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin-top: 12px; font-variant-numeric: tabular-nums; }
  .kv div:nth-child(odd) { color: var(--text-2); }
  .kv div:nth-child(even) { text-align: right; }

  /* 미국 섹터 가로 막대 (낮은 순 → 높은 순, 상·하위 2개만 초록) */
  .hbars { position: relative; }
  .hbar-row { display: grid; grid-template-columns: 84px 1fr 60px; align-items: center; gap: 8px; padding: 4px 0; }
  .hbar-name { color: var(--text-2); font-size: 13px; }
  .hbar-track { position: relative; height: 14px; }
  .hbar-axis { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--text-3); }   /* 전체를 관통하는 0선 하나 */
  .hbar { position: absolute; top: 0; height: 14px; background: var(--track); }
  .hbar-row.hi .hbar { background: var(--brand); }
  .hbar-val { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }

  /* 업종 순위 */
  table + table { margin-top: 16px; }   /* 표 두 개를 위아래로 둘 때 간격 */

  /* CNN 게이지 */
  .meter { position: relative; margin: 14px 0 4px; }
  .meter-track { display: grid; grid-template-columns: 25fr 20fr 11fr 20fr 25fr; gap: 2px; height: 8px; }
  .meter-track span { border-radius: 2px; background: var(--track); }
  .meter-track span.on { background: var(--brand); }               /* 현재 구간: 초록 */
  .meter-pin { position: absolute; top: -5px; width: 4px; height: 18px; margin-left: -2px; border-radius: 2px; background: var(--text-2); }   /* 지수 위치 바늘: 진한 회색 */
  .meter-labels { display: grid; grid-template-columns: 25fr 20fr 11fr 20fr 25fr; font-size: 11px; color: var(--text-3); margin-top: 6px; }
  .meter-labels span { text-align: center; }
  .meter-labels span.on { color: var(--brand); font-weight: 700; }
  .fg-table { margin-top: 14px; table-layout: fixed; }   /* 네 칸 너비를 똑같이 */

  /* FedWatch 확률 막대 */
  /* 막대를 칸 배경으로 그림 → 칸 안에는 '인하/동결/인상' 글자만 있어서 복사하면 깔끔한 표가 됨 */
  .prob-label {
    width: 100%; --fill: var(--text-2);
    background-image: linear-gradient(var(--fill), var(--fill)), linear-gradient(var(--track), var(--track));
    background-size: calc((100% - 58px) * var(--w)) 10px, calc(100% - 58px) 10px;   /* 44px(글자 자리) + 14px(오른쪽 여백) */
    background-position: 44px center, 44px center;
    background-repeat: no-repeat;
  }
  tr.likely .prob-label { --fill: var(--accent); }
  .prob-now { font-weight: 700; padding-left: 12px !important; }
  .prob-chg { font-size: 12px; padding-left: 12px !important; }

  #tip { position: fixed; pointer-events: none; z-index: 10; background: var(--text-1); color: var(--card); font-size: 12px; padding: 6px 9px; border-radius: 6px; opacity: 0; transition: opacity .1s; white-space: nowrap; }

  footer { margin-top: 32px; color: var(--text-3); font-size: 12px; line-height: 1.7; }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <img src="assets/eibc-logo-white.png" alt="EIBC">
      <span class="brand-sub">Ewha Investment Banking Club</span>
    </div>
    <div class="actions">
      <span class="status" id="status"></span>
      <button id="refresh">Update</button>
    </div>
  </div>
</div>
<div class="wrap">
  <header>
    <div class="title">
      <h1>Macro Terminal</h1>
      <div class="sub" id="updated">-</div>
    </div>
  </header>
  <div id="notice"></div>
  <main id="app"></main>
  <footer>
    출처: 구글 파이낸스(미국 지수·VIX·섹터 ETF), CNBC(국채·달러인덱스·유가), 네이버 증권(국내 지수·수급·환율·업종),
    CNN(공포·탐욕 지수), 애틀랜타 연은·FRED(GDPNow), 30일 연방기금 선물(FedWatch 방식 직접 계산).<br><br>
    © 2026 EIBC — Ewha Investment Banking Club. All rights reserved.
  </footer>
</div>
<div id="tip"></div>
<script>
  // Apps Script 웹 앱 주소 (배포 관리에서 복사한 …/exec 주소를 붙여넣기)
  const API_URL = 'https://script.google.com/macros/s/AKfycbzfSt902rwWssJQMAZqUu0fOrBwKHMCvigJoEKmWcgteIKnOZCRuqlnnQhvM-aRCWdo/exec';

  // 스냅샷 JSON 받아오기 — GET만, 커스텀 헤더 없이 (CORS preflight 방지)
  async function fetchSnap(refresh) {
    const url = API_URL + '?format=json' + (refresh ? '&action=refresh' : '');
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data && data.error) throw new Error(data.error);
    return data;
  }

  /* ---------- 숫자·색 도우미 ---------- */
  const isNum = v => typeof v === 'number' && isFinite(v);
  const fmt = (v, d = 2) => isNum(v) ? v.toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d }) : '-';
  const sgn = (v, d = 2) => isNum(v) ? (v > 0 ? '+' : '') + fmt(v, d) : '-';
  const cls = v => !isNum(v) ? 'flat' : v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
  const arrow = v => !isNum(v) ? '' : v > 0 ? '▲ ' : v < 0 ? '▼ ' : '';
  const chg = (v, d = 2, suffix = '') => `<span class="${cls(v)}">${arrow(v)}${sgn(v, d)}${suffix}</span>`;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const md = s => s ? String(s).slice(5, 10).replace('-', '/') : '';   // 2026-10-12 → 10/12
  const day = s => {
    if (!s) return '';
    const d = new Date(String(s).slice(0, 10) + 'T12:00:00');
    return isNaN(d) ? md(s) : md(s) + ' (' + '일월화수목금토'[d.getDay()] + ')';
  };

  /* ---------- 카드 틀 ---------- */
  function card(sec, title, meta, body, wide) {
    let badge = '';
    if (sec && sec.stale) {
      badge = sec.data
        ? `<span class="badge" title="${esc(sec.error || '')}">이전 값 · ${esc(sec.at || '')}</span>`
        : `<span class="badge" title="${esc(sec.error || '')}">수집 실패</span>`;
    }
    const content = (sec && sec.data) ? body(sec.data) : '<div class="note">아직 수집된 데이터가 없어요.</div>';
    return `<section class="card${wide ? ' wide' : ''}">
      <div class="card-title">${title}${badge}</div>
      ${content}
      ${meta ? `<div class="meta">${meta}</div>` : ''}</section>`;
  }

  /* ---------- 렌더 ---------- */
  function render(snap) {
    const S = (snap && snap.sections) || {};
    const d = k => (S[k] && S[k].data) || null;
    const usDate = d('usIndices') && d('usIndices').rows[0] ? d('usIndices').rows[0].date : '';

    document.getElementById('updated').textContent = snap && snap.updatedAt ? `Last update: ${snap.updatedAt}` : '수집 기록 없음';
    const staleNames = Object.keys(S).filter(k => S[k].stale);
    document.getElementById('notice').innerHTML = staleNames.length
      ? `<div class="notice">일부 항목(${staleNames.length}개)은 이번 수집에 실패해서 직전 값을 보여주고 있어요. 카드의 ‘이전 값’ 표시에 마우스를 올리면 이유가 보여요.</div>` : '';

    let h = '';

    /* 미국·글로벌 */
    h += '<h2>Global Markets</h2><div class="grid">';
    h += card(S.usIndices, '미국 4대 지수', usDate ? day(usDate) + ' 마감' : '', x => `
      <table><tr><th>지수</th><th>종가</th><th>등락폭</th><th>등락률</th></tr>
      ${x.rows.map(r => `<tr><td>${esc(r.name)}</td><td>${fmt(r.price)}</td><td>${chg(r.change)}</td><td>${chg(r.pct, 2, '%')}</td></tr>`).join('')}
      </table>
      <div class="kv"><div>등락률 순</div><div>${esc(x.order)}</div></div>`);

    h += card(S.rates, '미국 국채 금리', d('rates') && d('rates').us10y.time ? day(d('rates').us10y.time) + ' 기준' : '', x => `
      <table><tr><th>만기</th><th>금리</th><th>전일 대비</th></tr>
      <tr><td>10년물</td><td>${fmt(x.us10y.last, 3)}%</td><td>${chg(isNum(x.us10y.change) ? x.us10y.change * 100 : null, 1, 'bp')}</td></tr>
      <tr><td>2년물</td><td>${fmt(x.us2y.last, 3)}%</td><td>${chg(isNum(x.us2y.change) ? x.us2y.change * 100 : null, 1, 'bp')}</td></tr>
      </table>
      <div class="kv"><div>장단기 금리차 (10년 − 2년)</div><div>${sgn(x.spreadBp, 1)}bp <span class="chip">${esc(x.curve)}</span></div></div>`);

    h += card(S.dollarOil, '달러 · 유가', '', x => `
      <table><tr><th>항목</th><th>종가</th><th>등락폭</th><th>등락률</th></tr>
      ${[['달러인덱스', x.dxy], ['WTI', x.wti], ['브렌트유', x.brent]].filter(r => r[1]).map(([n, q]) =>
        `<tr><td>${n}</td><td>${fmt(q.last)}</td><td>${chg(q.change)}</td><td>${chg(q.pct, 2, '%')}</td></tr>`).join('')}
      </table>`);

    h += card(S.vix, '변동성 (VIX)', usDate ? day(usDate) + ' 마감' : '', x => `
      <div class="hero"><span class="big">${fmt(x.last)}</span>${chg(x.change)} ${chg(x.pct, 2, '%')}</div>
      <div class="kv"><div>상태 (20 기준)</div><div><span class="chip">${esc(x.state)}</span></div></div>`);

    h += card(S.usSectors, '미국 섹터 등락률 (SPDR ETF)', usDate ? day(usDate) + ' 마감' : '', x => {
      const list = x.list.slice().sort((a, b) => b.pct - a.pct);       // 높은 순 → 낮은 순
      const up = Math.max(0, ...list.map(r => r.pct));                  // 0선 오른쪽으로 가장 긴 값
      const dn = Math.max(0, ...list.map(r => -r.pct));                 // 0선 왼쪽으로 가장 긴 값
      const total = Math.max(0.5, up + dn);
      const zero = dn / total * 100;                                    // 0선 위치 (%)
      return `<div class="hbars"><div class="hbar-axis" style="left:calc(92px + (100% - 160px) * ${zero / 100})"></div>${list.map((r, i) => {
        const hi = i < 2 || i >= list.length - 2;                       // 하위 2개·상위 2개
        const w = Math.abs(r.pct) / total * 100;
        const left = r.pct >= 0 ? zero : zero - w;
        return `<div class="hbar-row${hi ? ' hi' : ''}" data-tip="${esc(r.name)} · ${esc(r.ticker.split(':')[1])} · ${sgn(r.pct)}%">
          <div class="hbar-name">${esc(r.name)}</div>
          <div class="hbar-track"><div class="hbar" style="left:${left}%;width:max(1px, ${w}%)"></div></div>
          <div class="hbar-val ${cls(r.pct)}">${sgn(r.pct)}%</div></div>`;
      }).join('')}</div>`;
    }, true);
    h += '</div>';

    /* 매크로 지표 */
    h += '<h2>Market Sentiment & Fed</h2><div class="grid">';
    h += card(S.sentiment, 'Fear & Greed 지수', d('sentiment') ? (d('sentiment').source === '수동 입력' ? '수동 입력' : day(d('sentiment').date)) : '', x => {
      const zones = [[0, 25], [25, 45], [45, 56], [56, 76], [76, 101]];
      const on = zones.findIndex(([a, b]) => x.score >= a && x.score < b);
      const wk = isNum(x.week) ? x.score - x.week : null;
      return `<div class="hero"><span class="big">${fmt(x.score, 0)}</span><span class="chip">${esc(x.rating)}</span></div>
        <div class="kv"><div>지난주 대비</div><div>${isNum(wk) ? chg(wk, 0) : '-'}</div></div>
        <div class="meter"><div class="meter-track">${zones.map((z, i) => `<span class="${i === on ? 'on' : ''}"></span>`).join('')}</div>
          <div class="meter-pin" style="left:${Math.max(0, Math.min(100, x.score))}%"></div></div>
        <div class="meter-labels">${['극단적 공포', '공포', '중립', '탐욕', '극단적 탐욕'].map((t, i) => `<span class="${i === on ? 'on' : ''}">${t}</span>`).join('')}</div>
        <table class="fg-table"><tr><th>시점</th><th>전일</th><th>1주 전</th><th>1개월 전</th></tr>
          <tr><td>지수</td><td>${fmt(x.prev, 0)}</td><td>${fmt(x.week, 0)}</td><td>${fmt(x.month, 0)}</td></tr></table>`;
    });

    h += card(S.gdpnow, 'Atlanta Fed GDP Now', d('gdpnow') ? day(d('gdpnow').date) + ' 업데이트' : '', x => `
      <div class="hero"><span class="big">${fmt(x.now, 1)}%</span><span class="unit">${esc(x.quarter)} 성장률 추정 (연율)</span></div>
      <div class="kv"><div>지난주 대비</div><div>${x.status === '신규 분기' ? '<span class="chip">신규 분기</span>' : `<span class="chip">${esc(x.status)}</span> ${chg(x.change, 1, '%p')}`}</div>
      <div>1주 전</div><div>${isNum(x.prev) ? fmt(x.prev, 1) + '%' : '-'}</div></div>`);

    h += card(S.fedwatch, 'FedWatch', d('fedwatch') && d('fedwatch').meeting ? day(d('fedwatch').meeting) + ' 회의' : '', x => `
      <table><tr><th>구분</th><th>이번 주</th><th>지난주 대비</th></tr>
      ${x.rows.map(r => `<tr${r.label === x.likely ? ' class="likely"' : ''} data-tip="${r.label} · 이번 주 ${fmt(r.now, 1)}% · 지난주 ${isNum(r.week) ? fmt(r.week, 1) + '%' : '-'}">
        <td class="prob-label" style="--w:${isNum(r.now) ? Math.max(0, Math.min(100, r.now)) / 100 : 0}">${r.label}</td>
        <td class="prob-now">${fmt(r.now, 1)}%</td>
        <td class="prob-chg">${isNum(r.change) ? chg(r.change, 1, '%p') : '-'}</td></tr>`).join('')}
      </table>
      <div class="kv"><div>유력 시나리오</div><div><span class="chip">${esc(x.likely)}</span></div></div>`);
    h += '</div>';

    /* 국내 */
    const kr = d('krIndices');
    h += '<h2>Korea Market</h2><div class="grid">';
    h += card(S.krIndices, '국내 지수', kr && kr.rows[0] ? day(kr.rows[0].date) : '', x => `
      <table><tr><th>지수</th><th>종가</th><th>등락폭</th><th>등락률</th></tr>
      ${x.rows.map(r => `<tr><td>${esc(r.name)}</td><td>${fmt(r.close)}</td><td>${chg(r.change)}</td><td>${chg(r.pct, 2, '%')}</td></tr>`).join('')}
      </table>
      <div class="kv"><div>비교</div><div>${esc(String(x.compare).replace('코스닥가', '코스닥이'))}</div><div>스타일</div><div>${esc(x.style)}</div></div>`);

    h += card(S.flows, '투자자별 순매수 (억원)', d('flows') ? day(d('flows').kospi.date) : '', x => `
      <table><tr><th>시장</th><th>개인</th><th>외국인</th><th>기관</th></tr>
      ${[['코스피', x.kospi], ['코스닥', x.kosdaq]].map(([n, r]) =>
        `<tr><td>${n}</td><td class="${cls(r.personal)}">${sgn(r.personal, 0)}</td><td class="${cls(r.foreign)}">${sgn(r.foreign, 0)}</td><td class="${cls(r.institution)}">${sgn(r.institution, 0)}</td></tr>`).join('')}
      </table>`);

    h += card(S.usdkrw, '원/달러 환율', d('usdkrw') ? day(d('usdkrw').date) : '', x => `
      <div class="hero"><span class="big">${fmt(x.close)}</span><span class="unit">원</span></div>
      <div class="kv"><div>전일 대비</div><div>${chg(x.change)}원 (${sgn(x.pct)}%)</div></div>
      <div class="note">${isNum(x.change) ? (x.change > 0 ? '원화 약세 (환율 상승)' : x.change < 0 ? '원화 강세 (환율 하락)' : '보합') : ''}</div>`);

    h += card(S.krSectors, '국내 업종 등락 순위', '', x => {
      // 다른 카드처럼 <table>로 그려야 엑셀·PPT에 표로 붙여넣어짐
      const split = s => {
        const m = String(s || '').match(/^(.*)\s\(([^)]+)\)$/);
        return m ? [m[1], m[2]] : [s || '', ''];
      };
      // 상승·하락을 따로 복사할 수 있게 표 두 개를 위아래로
      const table = (head, list) => `<table><tr><th>${head}</th><th>등락률</th></tr>${list.map(s => {
        const [name, val] = split(s);
        return `<tr><td>${esc(name)}</td><td class="${cls(parseFloat(val))}">${esc(val)}</td></tr>`;
      }).join('')}</table>`;
      return table('상승 1·2위', x.top) + table('하락 1·2위', x.bottom);
    });
    h += '</div>';

    document.getElementById('app').innerHTML = h;
  }




  /* ---------- 툴팁 ---------- */
  const tip = document.getElementById('tip');
  document.addEventListener('mousemove', e => {
    const el = e.target.closest('[data-tip]');
    if (!el) { tip.style.opacity = 0; return; }
    tip.textContent = el.getAttribute('data-tip');
    tip.style.left = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8) + 'px';
    tip.style.top = (e.clientY + 14) + 'px';
    tip.style.opacity = 1;
  });

  /* ---------- Update Button ---------- */
  const btn = document.getElementById('refresh'), status = document.getElementById('status');
  btn.addEventListener('click', () => {
    btn.disabled = true;
    status.textContent = '수집 중… ';
    fetchSnap(true)
      .then(s => { render(s); status.textContent = '갱신 완료'; })
      .catch(err => { status.textContent = '갱신 실패: ' + err.message; })
      .finally(() => { btn.disabled = false; });
  });

  // 처음 열 때 스냅샷 불러오기
  document.getElementById('updated').textContent = '데이터 불러오는 중…';
  fetchSnap(false)
    .then(render)
    .catch(err => {
      render(null);
      document.getElementById('updated').textContent = '불러오기 실패: ' + err.message;
    });
</script>
</body>
</html>
